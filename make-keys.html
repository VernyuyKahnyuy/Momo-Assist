<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Make notification keys</title>
<style>body{font:16px system-ui;max-width:560px;margin:0 auto;padding:20px;display:flex;flex-direction:column;gap:14px}textarea{width:100%;min-height:80px;font:13px monospace;padding:10px;border-radius:10px;border:1.5px solid #8a948f;box-sizing:border-box}button{min-height:50px;border:0;border-radius:10px;background:#0a7a57;color:#fff;font:700 1rem system-ui}small{color:#555}</style></head><body>
<h1>Notification keys</h1>
<p>Tap the button. The keys are made on this phone and are not sent anywhere. Save both somewhere safe. <b>Delete this file from your site afterwards.</b></p>
<button id="go">Make my keys</button>
<label>Public key (goes in config.js and in Supabase)</label><textarea id="pub" readonly></textarea>
<label>Private key (secret. Supabase only. Never put it in config.js)</label><textarea id="prv" readonly></textarea>
<script>
function b64u(buf){var s='',b=new Uint8Array(buf);for(var i=0;i<b.length;i++)s+=String.fromCharCode(b[i]);return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');}
document.getElementById('go').onclick=function(){
  crypto.subtle.generateKey({name:'ECDSA',namedCurve:'P-256'},true,['sign','verify']).then(function(k){
    return Promise.all([crypto.subtle.exportKey('raw',k.publicKey),crypto.subtle.exportKey('jwk',k.privateKey)]);
  }).then(function(r){document.getElementById('pub').value=b64u(r[0]);document.getElementById('prv').value=r[1].d;})
  .catch(function(){alert('This browser could not make keys. Try Chrome.');});
};
</script></body></html>
