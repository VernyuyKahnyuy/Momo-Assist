<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MoMo Self Checkout</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Hanken+Grotesk:wght@400;500;600&display=swap">
<style>
:root {
  --bg: #fff9db; --surface: #ffffff; --ink: #111111; --muted: #5f5a45; --line: #e6dca0;
  --yellow: #ffcc00; --blue: #1d4ed8; --blue-ink: #ffffff; --black: #111111; --warn: #b42318;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "Hanken Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
  box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #0c0c0e; --surface: #18181c; --ink: #f6f3e4; --muted: #a8a28a; --line: #34322a; --blue: #5b8cff; --blue-ink: #08122e; --warn: #ff8a7a; color-scheme: dark; }
}
:root[data-theme="dark"] { --bg: #0c0c0e; --surface: #18181c; --ink: #f6f3e4; --muted: #a8a28a; --line: #34322a; --blue: #5b8cff; --blue-ink: #08122e; --warn: #ff8a7a; color-scheme: dark; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 16px/1.45 var(--font-body); padding: 0 16px 32px; }
.wrap { max-width: 460px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
.hero { background: var(--black); color: #fff; border-radius: 0 0 22px 22px; margin: 0 -16px; padding: 28px 22px 26px; border-bottom: 6px solid var(--yellow); }
.hero small { display: inline-block; background: var(--yellow); color: #111; font: 700 0.72rem var(--font-display); letter-spacing: 0.08em; text-transform: uppercase; padding: 4px 10px; border-radius: 999px; }
h1 { font: 800 1.9rem/1.1 var(--font-display); margin: 14px 0 8px; letter-spacing: -0.01em; text-wrap: balance; }
h1 span { color: var(--yellow); }
.hero p { margin: 0; color: #d9d6c4; }
.label { font: 700 0.75rem var(--font-body); text-transform: uppercase; letter-spacing: 0.09em; color: var(--muted); margin: 0 0 8px; }
.jobs { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.job { min-height: 64px; border-radius: 14px; border: 2px solid var(--line); background: var(--surface); color: var(--ink); font: 700 1.05rem var(--font-display); cursor: pointer; }
.job[aria-pressed="true"] { background: var(--yellow); border-color: var(--black); color: #111; box-shadow: 0 4px 0 var(--black); }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-weight: 600; }
input { width: 100%; min-height: 56px; border-radius: 14px; border: 2px solid var(--line); background: var(--surface); color: var(--ink); padding: 0 16px; font: 600 1.3rem var(--font-body); letter-spacing: 0.02em; }
input::placeholder { color: var(--muted); opacity: 0.55; font-weight: 400; }
input:focus-visible, button:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }
.hint { font-size: 0.85rem; color: var(--muted); min-height: 1.2em; }
.hint.bad { color: var(--warn); }
.jobs .job:last-child { grid-column: 1 / -1; }
.opts { display: grid; gap: 10px; }
.opts.three { grid-template-columns: repeat(3, 1fr); }
.opt { min-height: 56px; border-radius: 14px; border: 2px solid var(--line); background: var(--surface); color: var(--ink); font: 600 0.95rem var(--font-body); padding: 8px 10px; cursor: pointer; text-align: center; }
.opt[aria-pressed="true"] { background: var(--blue); border-color: var(--blue); color: var(--blue-ink); }
.status { text-align: center; font-weight: 600; padding: 10px; border-radius: 12px; background: var(--black); color: var(--yellow); }
.status.warn { background: var(--surface); color: var(--warn); border: 2px solid var(--warn); }
.go { min-height: 60px; border-radius: 14px; border: 0; background: var(--blue); color: var(--blue-ink); font: 800 1.1rem var(--font-display); cursor: pointer; }
.go:disabled { opacity: 0.4; cursor: not-allowed; }
.ghost { min-height: 52px; border-radius: 14px; border: 2px solid var(--ink); background: none; color: var(--ink); font: 700 1rem var(--font-display); cursor: pointer; }
.ticket { background: var(--surface); border: 2px solid var(--black); border-top: 10px solid var(--yellow); border-radius: 16px; padding: 18px; display: flex; flex-direction: column; gap: 10px; }
.ticket h2 { font: 800 1.5rem var(--font-display); margin: 0; }
.row { display: flex; justify-content: space-between; gap: 12px; padding-bottom: 8px; border-bottom: 1px dashed var(--line); }
.row span { color: var(--muted); }
.row b { font-variant-numeric: tabular-nums; text-align: right; }
.ref { font: 800 1.6rem var(--font-display); color: var(--blue); letter-spacing: 0.08em; text-align: center; }
.note { text-align: center; color: var(--muted); font-size: 0.9rem; margin: 0; }
</style></head>
<body>
<div class="wrap">
  <header class="hero">
    <small>Self checkout</small>
    <h1>Welcome, <span>Bienvenue!</span></h1>
    <p>Tell us what you need, leave your number and the amount, and we’ll take care of the rest. It takes less than a minute.</p>
  </header>

  <main id="formView" class="wrap" style="gap:18px">
    <section>
      <p class="label">1. What do you need?</p>
      <div class="jobs" id="jobs"></div>
    </section>
    <section id="optBox" hidden>
      <p class="label" id="optLabel"></p>
      <div class="opts" id="opts"></div>
    </section>
    <div class="field">
      <label for="num">2. Your phone number</label>
      <input id="num" type="tel" inputmode="numeric" autocomplete="tel" placeholder="6XX XXX XXX" maxlength="13">
      <div class="hint" id="numHint"></div>
    </div>
    <div class="field">
      <label for="amt">3. Amount (FCFA)</label>
      <input id="amt" type="text" inputmode="numeric" placeholder="10 000" maxlength="11">
      <div class="hint" id="amtHint"></div>
    </div>
    <button class="go" id="go" disabled>Send my request</button>
  </main>

  <section id="doneView" class="wrap" hidden style="gap:16px">
    <div class="ticket">
      <h2>Request sent ✔</h2>
      <div class="row"><span>Job</span><b id="rJob"></b></div>
      <div class="row"><span>Number</span><b id="rNum"></b></div>
      <div class="row"><span>Details</span><b id="rDet"></b></div>
      <div class="row"><span>Amount</span><b id="rAmt"></b></div>
      <div class="ref" id="rRef"></div>
    </div>
    <div class="status" id="status"></div>
    <p class="note">Show this screen to the agent. Thank you for your trust, merci!</p>
    <button class="ghost" id="again">Make another request</button>
  </section>
</div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
(function () {
  // The request is sent as plain JSON. The agent terminal decides what code to build from it.
  // job ids: deposit, withdraw, airtime, float, gooddeal. `field` and `keys` are the machine values sent in details.
  var JOBS = [
    { id: 'deposit',  label: 'Deposit' },
    { id: 'withdraw', label: 'Withdraw' },
    { id: 'airtime',  label: 'Airtime' },
    { id: 'float',    label: 'Float', ask: 'What do you want to do?',
      opts: ['Send me float', 'I send you float, you give me cash'],
      field: 'floatMode', keys: ['send_to_client', 'receive_from_client'] },
    { id: 'gooddeal', label: 'Good deal', ask: 'Which bundle?',
      opts: ['Data only', 'Calls only', 'Calls + data'], three: true,
      field: 'bundle', keys: ['data', 'call', 'call_data'] }
  ];
  var job = null, opt = -1;
  var $ = function (id) { return document.getElementById(id); };
  function press(box, el) { Array.prototype.forEach.call(box.children, function (c) { c.setAttribute('aria-pressed', c === el ? 'true' : 'false'); }); }

  JOBS.forEach(function (j) {
    var b = document.createElement('button');
    b.type = 'button'; b.className = 'job'; b.textContent = j.label; b.setAttribute('aria-pressed', 'false');
    b.addEventListener('click', function () {
      job = j; opt = -1; press($('jobs'), b);
      $('opts').innerHTML = '';
      $('optBox').hidden = !j.opts;
      if (j.opts) {
        $('optLabel').textContent = j.ask;
        $('opts').className = 'opts' + (j.three ? ' three' : '');
        j.opts.forEach(function (t, k) {
          var o = document.createElement('button');
          o.type = 'button'; o.className = 'opt'; o.textContent = t; o.setAttribute('aria-pressed', 'false');
          o.addEventListener('click', function () { opt = k; press($('opts'), o); check(); });
          $('opts').appendChild(o);
        });
      }
      check();
    });
    $('jobs').appendChild(b);
  });

  function digits(s) { return s.replace(/\D/g, ''); }
  function localNum() { return digits($('num').value).replace(/^237/, ''); }
  function fmt(n) { return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, '\u202f'); }
  function amount() { return Number(digits($('amt').value)) || 0; }

  function check() {
    var n = localNum(), a = amount();
    var numOk = /^6\d{8}$/.test(n);
    $('numHint').textContent = !n || numOk ? '' : 'Enter 9 digits starting with 6.';
    $('numHint').className = 'hint' + (!n || numOk ? '' : ' bad');
    var d = digits($('amt').value);
    $('amt').value = d ? fmt(Number(d)) : '';
    $('amtHint').textContent = a > 0 ? fmt(a) + ' FCFA' : '';
    var optOk = !job || !job.opts || opt > -1;
    $('go').disabled = !(job && optOk && numOk && a > 0);
  }
  $('num').addEventListener('input', check);
  $('amt').addEventListener('input', check);

  // Sends the request to the agent through Supabase. Resolves true when delivered.
  var sb = null, watchId = 0;
  (function () { var C = window.MOMO_CONFIG; if (C && window.supabase && !/YOUR-/.test(C.url)) sb = window.supabase.createClient(C.url, C.key); })();
  function deliver(req) {
    if (!sb) return Promise.resolve(false);
    return sb.from('requests').insert({ id: req.id, job: req.job, details: req.details, num: req.num, amt: req.amt, currency: 'FCFA' })
      .then(function (r) { return !r.error; }, function () { return false; });
  }
  // After sending, shows the client whether the agent accepted or rejected.
  function watch(id) {
    var mine = ++watchId, tries = 0;
    (function poll() {
      if (mine !== watchId || tries++ > 150) return;
      sb.rpc('request_status', { rid: id }).then(function (r) {
        if (mine !== watchId) return;
        if (r.data === 'accepted') { $('status').className = 'status'; $('status').textContent = 'The agent accepted your request.'; return; }
        if (r.data === 'rejected') { $('status').className = 'status warn'; $('status').textContent = 'The agent could not do this request.'; return; }
        setTimeout(poll, 4000);
      }, function () { setTimeout(poll, 8000); });
    })();
  }

  $('go').addEventListener('click', function () {
    var n = localNum(), a = amount();
    var detail = job.opts ? job.opts[opt] : '';
    var details = {};
    if (job.field) details[job.field] = job.keys[opt];
    var req = {
      v: 1,
      id: 'r' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5),
      t: Date.now(), status: 'pending', job: job.id, details: details,
      num: n, phone: '237' + n, amt: a, currency: 'FCFA'
    };
    $('go').disabled = true; $('go').textContent = 'Sending…';
    deliver(req).then(function (ok) {
      $('rJob').textContent = job.label;
      $('rNum').textContent = n.replace(/(\d{3})(\d{3})(\d{3})/, '$1 $2 $3');
      $('rDet').textContent = detail || '-';
      $('rAmt').textContent = fmt(a) + ' FCFA';
      $('rRef').textContent = '#' + req.id.slice(-4).toUpperCase();
      $('status').className = 'status' + (ok ? '' : ' warn');
      $('status').textContent = ok ? 'The agent has your request.' : 'Could not reach the agent. Please show this screen to them.';
      $('formView').hidden = true; $('doneView').hidden = false;
      $('go').textContent = 'Send my request';
      window.scrollTo(0, 0);
      if (ok) watch(req.id);
    });
  });

  $('again').addEventListener('click', function () {
    watchId++;
    job = null; opt = -1; $('num').value = ''; $('amt').value = ''; $('optBox').hidden = true;
    Array.prototype.forEach.call($('jobs').children, function (c) { c.setAttribute('aria-pressed', 'false'); });
    $('doneView').hidden = true; $('formView').hidden = false; check();
  });
})();
</script>
</body></html>
